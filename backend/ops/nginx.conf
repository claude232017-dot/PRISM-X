# Load balancer in front of the PRISM-X API.
#
# Docker's embedded DNS resolves `api` to every replica, so this needs no
# static upstream list and picks up instances added by `--scale` without a
# reload.
upstream prismx_api {
    server api:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The instance behind the balancer sees this rather than the balancer's own
    # address, which is what makes rate limiting and IP restrictions meaningful.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Server-sent events need buffering off, or the client receives the stream
    # in one lump when it closes.
    location /api/v1/events/stream {
        proxy_pass http://prismx_api;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://prismx_api;
        proxy_read_timeout 120s;
        # Retry the next instance when one is restarting mid-deploy, so a
        # rolling restart is invisible to callers rather than a burst of 502s.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /healthz {
        proxy_pass http://prismx_api/api/v1/ops/health/live;
        access_log off;
    }
}
