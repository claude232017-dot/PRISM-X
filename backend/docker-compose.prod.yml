# ============================================================
# PRISM-X — production-shaped deployment
#
# Two backend instances behind nginx, sharing one database, one cache and one
# queue. Two rather than one on purpose: it is the smallest topology that
# exercises leader election, shared rate limiting and stateless routing, so
# problems that only appear with N > 1 appear here rather than in production.
#
#   docker compose -f docker-compose.prod.yml up --scale api=3
#
# Every secret comes from the environment. There are no defaults below for
# anything that matters — a missing value should stop the deployment, not
# quietly ship a known password.
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-prismx}
    volumes: ['prismx-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes: ['prismx-redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs once and exits. Separating migration from startup means N instances
  # do not race to apply the same migration, and a failed migration stops the
  # deploy instead of leaving half the fleet on a schema the code cannot use.
  migrate:
    build: .
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prismx}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: .
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PORT: 3000
      TRUST_PROXY: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prismx}?schema=public
      # Per instance. Two replicas at 10 each plus the migrate job leaves
      # ample room under Postgres' default max_connections of 100; raise
      # both together, never the replica count alone.
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Per instance; multiplied by `replicas` below. This is the throttle on
      # concurrent provider calls across the fleet.
      MISSION_CONCURRENCY: ${MISSION_CONCURRENCY:-5}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # No published port: instances are reachable only through the balancer,
    # which is what makes `--scale` work without port collisions.
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/v1/ops/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Long enough for the shutdown hook to release the scheduler lease and
    # drain in-flight requests before the process is killed.
    stop_grace_period: 30s
    deploy:
      replicas: 2
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ['${HTTP_PORT:-8080}:80']
    volumes: ['./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api]
    restart: unless-stopped

volumes:
  prismx-postgres:
  prismx-redis:
